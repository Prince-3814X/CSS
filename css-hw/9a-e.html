<!DOCTYPE html>
<html>

<head>
    <title>Practice the div element</title>
    <link rel ="stylesheet" href= "style/9a-e.css">

<body>

    <div class="square"></div>
    <div class="circle"></div>


    <div class="feedback">

        <p class="text">Satisfied with our service? </p>
        <button class="click">Yes</button>
        <button class="no">No</button>
    </div>

    <div class="card">

        <p class="title">Install Youtube Music </p>
        <p class="content">Add Youtube Music to your desktop for quick and <br>easy access</p>


    </div>
    <div class="wrap">

        <img class="channel" src="images/luffy.jpg">
        <input class="text" type="text" placeholder="What's happening?">
        <button class="tweet">Tweet</button>
    </div>



</body>
</head>

</html>
