<!DOCTYPE html>
<html>

<head>
    <title>Notificatio-Menu</title>
    <link rel="stylesheet" href="style/12e-g.css">

</head>

<body>
   

    <!--12-e Question-->

    <!--biggest container that include all-->

    <div class="container">

        <div class="item">

            <span class="text">Home</span>
            <span class="badge">14</span>

        </div>

        <div class="item">

            <span class="text">Notifications</span>
            <span class="badge">3</span>

        </div>

        <div class="item">

            <span class="text">Messages</span>
            <span class="badge">5</span>

        </div>
    </div>

    <!--12-f Question-->

    <div class="body">

        <span class="home">Home</span>
        <input class="search" type="text" placeholder="Search">
        <span class="button">Download</span>


    </div>

    <!--12-g Question-->

    <div class="row">

        <img class="profile" src="images/luffy.jpg">

        <div class="info">
            <p class="name">Luffy</p>
            <p class="type">Straw Hat</p>
            <p class="status">Popular</p>
        </div>

        <button class="follow">Follow</button>
    </div>
    <div class="row">

        <img class="profile" src="images/light.png">

        <div class="info">
            <p class="name">Light</p>
            <p class="type">Smartest</p>
            <p class="status">Popular</p>
        </div>

        <button class="follow">Follow</button>
    </div>


    <div class="row">

        <img class="profile" src="images/goku.png">

        <div class="info">
            <p class="name">goku</p>
            <p class="type">Fighter</p>
            <p class="status">Popular</p>
        </div>

        <button class="follow">Follow</button>
    </div>
