<!DOCTYPE html>
<html>

<head>
    <title>Nested-Flexbox</title>


</head>

<body>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            height: 50px;
            margin-bottom: 50px;


        }

        .pink {
            background-color: lightpink;
            height: 70px;
            width: 100px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .item {

            background-color: black;
            color: white;
            font-weight: bold;
            font-size: 20px;

        }

        .blue {
            background-color: lightblue;
            width: 200px;
            height: 70px;

        }

        /*13-b Question*/
        .cards {
            display: flex;
            flex-direction: row;
            height: 50px;



        }

        .pink1 {
            background-color: lightpink;
            width: 100px;

        }


        .blue1 {
            background-color: lightblue;
            width: 200px;

        }

        .items {
            display: flex;
            flex-direction: row;

        }

        .row2-container {
            display: flex;
            justify-content: space-between;
        }

        .black {

            background-color: black;
            color: white;
            justify-content: space-between;

        }
    </style>

    <div class="container">
        <div class="pink">
            <div class="item">item1</div>
        </div>

        <div class="blue "></div>
    </div>

    <!--13-b Question-->
    <div class="cards">

        <div class="pink1"> </div>
        <div class="blue1 ">
            <div class="items">row1</div>

            <div class="row2-container">

                <div class="black">row2</div>
                <div class="black">row2</div>

            </div>


        </div>




</html>
