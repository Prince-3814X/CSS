<!DOCTYPE html>
<html>

<head>
    <title>Position Absolute</title>

</head>
<style>
.body {
    height: 9000px; 
    font-family: Arial;
} 

.close {
    background-color: black; 
    font-size: 15px;
    color: white; 
    height: 45px; 
    width: 45px; 
    border-radius: 35px;
    top: -17px;
  left: -15px;
    position: absolute; 
    z-index: 1; 

      display: flex; 
    align-items: center;
    justify-content: center;

}
.box {
    background-color: grey; 
    height: 180px; 
    width: 320px; 
    bottom: 20px; 
    right: 20px;
    position: fixed; 

}

.time {
    background-color: black;
    color: white; 
    bottom: 10px; 
    right: 10px; 
    padding: 5px 10px; 
    position: absolute; 
   


}

</style>

<body>


<div class= "box"> 
<div class= "close"> X </div>
<div class= "time">0:29</div>
</div>


   
</body>


</html>
