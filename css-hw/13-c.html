<!DOCTYPE html>
<html>

<head>
    <title>Nested Flexbox</title>
    <link rel="stylesheet" href="style/13-c.css">
</head>

<body>

    <div class="container">

        <div class="heading">ALL INBOXES</div>

        <!-- Email 1 -->
        <div class="email-row">

            <img class="profile" src="images/zoro.png">

            <div class="email-content">

                <div class="title-row">
                    <div class="name">Monkey D. Luffy</div>
                    <div class="time">4:58 PM</div>
                </div>

                <div class="subject">
                    King of the Pirates
                </div>

                <div class="message">
                    Hey there! We're writing about your journey...
                </div>

            </div>

        </div>


        <!-- Email 2 -->
        <div class="email-row">

            <img class="profile" src="images/naruto.png">

            <div class="email-content">

                <div class="title-row">
                    <div class="name">Naruto Uzumaki</div>
                    <div class="time">2:58 AM</div>
                </div>

                <div class="subject">
                    Hokage of Leaf Village
                </div>

                <div class="message">
                    Hey there! We're writing about your journey...
                </div>

            </div>

        </div>


        <!-- Email 3 -->
        <div class="email-row">

            <img class="profile" src="images/light.png">

            <div class="email-content">

                <div class="title-row">
                    <div class="name">Light Yagami</div>
                    <div class="time">00:00</div>
                </div>

                <div class="subject">
                   Smartest One
                </div>

                <div class="message">
                    Hey there! We're writing about your journey...
                </div>

            </div>

        </div>

    </div>

</body>

</html>
