<!DOCTYPE html>
<html>

<head>

    <title>Position-Fixed </title>

</head>
<style>
    body {

        height: 3000px;
        font-family: Arial;
    }

    .side-bar {

        background-color: green;
        color: white;
        position: fixed;
        width: 300px;
        top: 0;
        right: 0;
        bottom: 0;

    }

    .card {
        width: 320px;
        height: 109px;
        border-radius: 7px;
        background-color: white;
        z-index: 1;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.25);
        margin-top: 90px;
        margin-left: 840px;
        position: fixed;
        
    }

    .title {
        font-size: 25px;
        font-weight: bold;
        padding-left: 15px;
        padding-top: 15px;
    }

    .content {
        padding-top: 8px;
        padding-left: 15px;

    }

    .close {
        margin-top: 8px;
        margin-left: 15px;
        border-radius: 2px;
        border-width: 1px;
        cursor: pointer;
    }
</style>

<body>

    <div class="side-bar">right sidebar </div>

    <div class=" card">

        <div class="title">Model Title</div>
        <div class="content">This is a model</div>
        <button class="close">Close</button>

    </div>

</body>
</head>

</html>
