<!DOCTYPE html>
<html>

<head>
    <title>Pagination </title>

<body>
    <style>
        .back-button {

            background-color: rgba(255, 255, 255, 0.46);
            height: 40px;
            width: 60px;
            border-radius: 2px;
            border-width: 1.5px;
            margin-left: 10px;
            margin-right: 15px;

        }
          .number {

            color: black;
            margin-left: 7px;
            margin-right: 7px;
            padding-top: 9px;
            padding-bottom: 7px;
            font-size: 18px;
        }


        .next-button {

            background-color: rgba(255, 255, 255, 0.137);
            height: 40px;
            width: 60px;
            border-width: 1.5px;
            margin-left: 20px;

        }

      
        .stretch-button {

            background-color: green;
            color: white;
            height: 40px;
            width: 80px;
            border: none;
            cursor: pointer;
            transition: all 0.15s;

        }

        .stretch-button:hover {
            height: 45px;
            width: 85px;

        }

        .three-d-click-button {

            background-color: green;
            color: white;
            height: 40px;
            width: 80px;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3);

        }

        .three-d-click-button:active {
            box-shadow: none;
            margin-top: 3px;
            margin-left: 3px;
            margin-bottom: 15px; 

        }

        .number-button {

            background-color: green;
            color: white;
            height: 40px;
          
            border: none;
            cursor: pointer;

            padding-left: 25px;
            padding-right: 25px;

            margin-left: 20px;
            margin-right: 20px;
            transition: all 0.15s;


        }

        .number-button:hover {
            padding-left: 60px;
            padding-right: 60px;
            margin-left: 0px;
            margin-right: 0px;
        }
    </style>
    <button class="back-button">Back</button>

    <a class=" number" href="https://google.com">1</a>
    <a class=" number" href="https://google.com">2</a>
    <a class=" number" href="https://google.com">3</a>
    <a class=" number" href="https://google.com">4</a>
    <a class=" number" href="https://google.com">5</a>

    <button class="next-button ">Next</button>
    <p>
        <button class="stretch-button">Stretch</button>
    </p>
    <button class="three-d-click-button">3D Click</button>
    </p>

    <button class="number-button ">One</button>

    <button class="number-button ">Two</button>

    <button class="number-button">Three</button>


</body>

</head>

</html>
