<!DOCTYPE html>
<html>

<head>
    <title>Position Absolute</title>

</head>
<style>
.body {
    height: 3000px; 
} 

.close {
    background-color: black; 
    font-size: 15px;
    color: white; 
    height: 45px; 
    width: 45px; 
    border-radius: 35px;
    display: flex; 
    align-items: center;
    justify-content: center;
    top: 15px;
    right: 15px; 
    position: absolute; 

}
.box {
    background-color: grey; 
    height: 180px; 
    width: 320px; 
    bottom: 15px; 
    right: 15px;
    position: fixed; 

}

</style>

<body>
<div class= "close"> X </div>

<div class= "box">  </div>


   
</body>


</html>
