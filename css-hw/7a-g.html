<!DOCTYPE html>
<html>

<head>
    <title>One Piece</title>
  

<body>
    <style>

          .luffy-image {
      width: 200px;
      border-radius: 20px;

  }

  .straw-image {
      width: 200px;
      height: 200px;
      object-fit: cover;
      object-position: center;


  }

  .hat-image {
      width: 200px;
      height: 200px;
      object-fit: cover;
      object-position: center;
      border-radius: 150px;
  }


  .search-box {
    display: block;
      height: 25px;
      width: 140px;
      border-style: solid;
      border-width: 1px;
      border-radius: 5px;
      padding-left: 8px;
      margin-left: 10px;
      margin-top: 20px;


  }

  .google-search {

      font-size: 12px;
      height: 30px;
      width: 500px;
      border: none;
      border-radius: 15px;
      padding-left: 15px;
      margin-top: 20px;
      margin-bottom: 20px;
      margin-left: 10px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
  }




  .mail {
      font-size: 14px;
      margin-bottom: 5px;
      margin-left: 10px;

  }



  .email {

      font-size: 12px;
      height: 30px;
      width: 250px;
      border: none;
      border: solid;
      border-width: 1px;
      border-radius: 2px;
      padding-left: 15px;
      margin-top: 0px;
      margin-bottom: 15px;
      margin-left: 10px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
  }

  .content {
      font-size: 14px;
      color: rgb(83, 83, 83);
      margin-top: 0px;
      margin-left: 10px;
    
  }



  .join {
      font-size: 18px;
      height: 40px;
      width: 250px;
      border: none;
      background-color: rgb(10, 102, 194);
      color: white;
      border: none;
      border-radius: 20px;
      padding-left: 15px;
      margin-top: 0px;
      margin-bottom: 15px;
      margin-left: 10px;
      display: block;
  }

  .channel {
      height: 50px;
      width: 50px;
      object-fit: cover;
      object-position: center;
      display: inline-block;
      margin-top: 20px;
      border-radius: 150px;
      vertical-align: middle;


  }

  .text {
      margin-top: 20px;
      font-size: 18px;
      border: none;
      width: 300px;
      vertical-align: middle;
      padding-left: 10px;
  }




  .tweet {

      font-size: 13px;
      font-weight: bold;
      height: 35px;
      width: 80px;
      border: none;
      background-color: rgb(29, 155, 240);
      color: white;
      border: none;
      border-radius: 20px;
      margin-top: 20px;
      margin-bottom: 15px;
      margin-left: 10px;
      vertical-align: middle;
  }
    </style>
  
      
    <img class="luffy-image" src="images/luffy.jpg">
    <img class="straw-image" src="images/luffy.jpg">
    <img class="hat-image" src="images/luffy.jpg">

    <input class="search-box" type="text" placeholder="Search">

    <input class="google-search" type="text" placeholder="Search Google or type a URL">


    <p class="mail">Email</p>
    <input class="email" type="text">
    <p class="content">By clicking Agree& Join, you agree to the Privacy Policy.</p>
    <button class="join">Agree & Join</button>

    <img class="channel" src="images/luffy.jpg">
    <input class="text" type="text" placeholder="What's happening?">
    <button class="tweet">Tweet</button>


    </head>
</body>


</html>
